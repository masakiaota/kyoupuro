[package]
name = "rectangle_swap_vis"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# ルートの solver workspace とは独立して visualizer をビルドする。
[workspace]

[dependencies]
wasm-bindgen = "0.2.100"
proconio = { version = "=0.4.5", features = ["derive"] }
rand = { version = "=0.8.6", features = ["small_rng", "min_const_gen"] }
rand_chacha = "=0.3.1"
rand_distr = "=0.4.3"
svg = "0.17.0"
getrandom = { version = "0.2.15", features = ["js"] }
