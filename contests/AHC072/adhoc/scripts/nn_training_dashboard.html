<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>NN 学習モニター</title>
<style>
:root{color-scheme:light dark;--bg:#f6f8fa;--panel:#fff;--text:#192a3a;--muted:#536579;--line:#dce3e9;--accent:#087f79;--raw:#a8b4c0;--alt:#c46a16;--bad:#b43838}
@media(prefers-color-scheme:dark){:root{--bg:#111923;--panel:#182330;--text:#e7eef6;--muted:#a6b5c5;--line:#324151;--accent:#5ce0c7;--raw:#68798b;--alt:#ffba76;--bad:#ff9090}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1150px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:24px;margin:0;letter-spacing:.03em}h2{font-size:16px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:12px}
.controls{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin:22px 0}label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}select,button{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px}select{max-width:100%}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#state{font-size:13px}.badge{border:1px solid var(--line);padding:3px 10px;border-radius:20px;color:var(--accent)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px 18px}.value{font-size:29px;font-weight:650;line-height:1.4}.caption{font-size:12px;color:var(--muted)}.charts{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:26px 0}.chart{min-width:0}svg{width:100%;display:block;background:var(--panel);border-radius:6px}svg text{font-family:inherit;fill:var(--muted);font-size:11px}.legend{font-size:12px;color:var(--muted);margin-top:4px}.legend span{margin-right:16px}.key{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;background:var(--accent)}.key.raw{background:var(--raw)}.key.alt{background:var(--alt)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-weight:500;color:var(--muted)}footer{margin-top:22px;color:var(--muted);font-size:12px}#error{color:var(--bad);min-height:24px}#diagnostics{margin:10px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}#path{overflow-wrap:anywhere}
@media(max-width:750px){main{padding:18px}.cards{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}.value{font-size:25px}#run{width:100%}.run-label{width:100%}}
</style>
</head>
<body><main>
<header><div><h1>NN 学習モニター</h1><div class="muted small">学習ログから見る、帰巣と手数短縮の推移</div></div><div id="state" aria-live="polite">読み込み中</div></header>
<div class="controls">
<label class="run-label">実験<select id="run" aria-label="表示する実験"></select></label>
<label id="window-label">移動平均<select id="window"><option value="10">10区間</option><option value="30" selected>30区間</option><option value="50">50区間</option><option value="100">100区間</option></select></label>
<button id="refresh" type="button">今すぐ更新</button>
<label style="display:block"><input id="auto" type="checkbox" checked> 1分ごとに更新</label>
</div>
<div id="error" role="status"></div>
<div class="cards" id="cards"></div>
<div id="context" class="small muted" style="margin-top:12px"></div>
<div class="charts">
<section class="chart"><h2 id="title-a">平均手数</h2><svg id="chart-a" viewBox="0 0 520 230" role="img" aria-label="学習曲線"></svg><div id="legend-a" class="legend"></div></section>
<section class="chart"><h2 id="title-b">帰巣率</h2><svg id="chart-b" viewBox="0 0 520 230" role="img" aria-label="学習曲線"></svg><div id="legend-b" class="legend"></div></section>
</div>
<div id="diagnostics"></div>
<h2>直近の記録</h2><div class="table-wrap"><table id="table"></table></div>
<footer><div id="path"></div><div id="updated"></div>平均手数は全帰巣した試行のみ。入力が区間ごとに異なるため、学習中の平均だけで性能改善を確定できない。BCの曲線は保存済みの測定点のみ。</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), fmt=(v,d=1)=>v==null?'—':Number(v).toLocaleString('ja-JP',{maximumFractionDigits:d,minimumFractionDigits:d});
const date=v=>v?new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',hour12:false}):'—';
let selected='', data=null, busy=false;
const NS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs,text){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!=null)e.textContent=text;return e;}
function chart(id,points,series,unit,fixed){
 const svg=$(id);svg.replaceChildren();
 const values=points.flatMap(p=>series.map(s=>p[s.key])).filter(v=>v!=null&&Number.isFinite(v));
 if(!values.length){svg.append(svgEl('text',{x:260,y:115,'text-anchor':'middle'},'測定記録待ち'));return;}
 const left=57,right=502,top=15,bottom=190;
 let lo=fixed?fixed[0]:Math.min(...values),hi=fixed?fixed[1]:Math.max(...values);
 if(!fixed){const gap=Math.max((hi-lo)*.12,1);lo=Math.max(0,lo-gap);hi+=gap;}
 const xmin=Math.min(...points.map(p=>p.x)),xmax=Math.max(...points.map(p=>p.x));
 const x=v=>left+(v-xmin)/Math.max(xmax-xmin,1)*(right-left),y=v=>bottom-(v-lo)/Math.max(hi-lo,1e-8)*(bottom-top);
 svg.append(svgEl('text',{x:left,y:12},unit));
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,yy=y(v);svg.append(svgEl('line',{x1:left,y1:yy,x2:right,y2:yy,stroke:'var(--line)'}));svg.append(svgEl('text',{x:left-8,y:yy+4,'text-anchor':'end'},fmt(v,unit==='%'?1:0)));}
 for(let i=0;i<=4;i++){const v=xmin+(xmax-xmin)*i/4;svg.append(svgEl('text',{x:x(v),y:bottom+20,'text-anchor':'middle'},fmt(v,0)));}
 svg.append(svgEl('text',{x:(left+right)/2,y:226,'text-anchor':'middle'},selectedRun()?.kind==='bc'?'学習周':'学習区間'));
 for(const s of series){let path='',open=false;for(const p of points){const v=p[s.key];if(v==null||!Number.isFinite(v)){open=false;continue;}path+=(open?' L':' M')+x(p.x).toFixed(1)+' '+y(v).toFixed(1);open=true;}svg.append(svgEl('path',{d:path,fill:'none',stroke:s.color,'stroke-width':s.key==='raw'?1:2.5}));
  for(const p of points){if(p[s.key]==null)continue;const dot=svgEl('circle',{cx:x(p.x),cy:y(p[s.key]),r:3,fill:s.color,opacity:s.key==='raw'?.25:.65});dot.append(svgEl('title',{},`${p.x}: ${s.label} ${fmt(p[s.key],2)}${unit}`));svg.append(dot);}}
}
function selectedRun(){return data?.runs.find(r=>r.id===selected);}
function card(label,value,caption){const e=document.createElement('div');e.className='card';for(const [cls,text]of [['caption',label],['value',value],['caption',caption]]){const d=document.createElement('div');d.className=cls;d.textContent=text;e.append(d);}return e;}
function table(headers,rows){const table=$('table');table.replaceChildren();const head=document.createElement('thead'),hr=document.createElement('tr');for(const text of headers){const cell=document.createElement('th');cell.textContent=text;hr.append(cell);}head.append(hr);table.append(head);const body=document.createElement('tbody');for(const row of rows){const tr=document.createElement('tr');for(const text of row){const td=document.createElement('td');td.textContent=text;tr.append(td);}body.append(tr);}table.append(body);}
function render(){
 const r=selectedRun();if(!r)return;
 $('state').textContent=`${r.status.label} · 記録 ${date(r.status.updated_at)}`;
 $('cards').replaceChildren();$('window-label').hidden=r.kind==='bc';
 if(r.kind==='rl'){
  const a=r.recent,t=r.total,l=r.latest;
  $('cards').append(card('平均手数',fmt(a.mean_T)+' 手',`直近${r.intervals}区間・全帰巣${fmt(a.successes,0)}試行`),card('帰巣率',fmt(a.success_rate,2)+'%',`${fmt(a.successes,0)} / ${fmt(a.episodes,0)} 試行`),card('経験した操作',fmt(r.steps/1e6,2)+' 百万',`区間 ${fmt(r.iteration,0)}`),card('監視メモリ',fmt(r.memory_gb,1)+' GB',r.memory_shared?'工程全体の最新監視記録':'学習側の監視記録'));
  $('context').textContent=`終了した試行の累計：${fmt(t.successes,0)} / ${fmt(t.episodes,0)} が全帰巣（${fmt(t.success_rate,2)}%）。進行中の試行は集計外。`;
  $('title-a').textContent='平均手数（少ないほどよい）';$('title-b').textContent='帰巣率';
  chart('chart-a',r.points,[{key:'raw',color:'var(--raw)',label:'各区間'},{key:'mean',color:'var(--accent)',label:'移動平均'}],'手');
  chart('chart-b',r.points,[{key:'success',color:'var(--accent)',label:'移動平均'}],'%',[Math.max(0,Math.min(95,...r.points.filter(p=>p.success!=null).map(p=>p.success))-1),100]);
  $('legend-a').innerHTML='<span><i class="key raw"></i>各区間</span><span><i class="key"></i>完走試行数で重み付けした移動平均</span>';
  $('legend-b').textContent='直近の成功試行数 ÷ 終了試行数';
  const speed=r.points.filter(p=>p.speed!=null).slice(-Number($('window').value));
  const valueLoss=r.method==='group'?'価値学習なし':`価値損失 ${fmt(l.value_loss,5)}`;
  const reverse=l.reverse_samples>0&&l.reverse_ce!=null?` · 逆再生の模倣CE ${fmt(l.reverse_ce,3)}`:'';
  $('diagnostics').textContent=`処理速度：${fmt(speed.length?speed.reduce((s,p)=>s+p.speed,0)/speed.length:null,0)} 操作/秒 · 方策損失 ${fmt(l.policy_loss,5)} · ${valueLoss} · KL ${fmt(l.approx_kl,5)} · 模倣補助CE ${fmt(l.bc_ce,3)}${reverse}${r.status.remaining_seconds!=null?' · 残り見積もり '+fmt(r.status.remaining_seconds/3600,1)+'時間':''}（損失の低下だけでは手数の改善を判定できない）`;
  table(['区間','全帰巣 / 終了','完走平均手数','方策損失','価値損失','経過時間'],r.rows.map(x=>[x.iteration,`${x.successes} / ${x.episodes}`,fmt(x.mean_T_completed),fmt(x.policy_loss,5),r.method==='group'?'学習なし':fmt(x.value_loss,5),fmt(x.seconds/60,1)+'分']));
 }else{
  const t=r.latest.train_fixed,v=r.latest.validation;
  $('cards').append(card('検証の方策損失',fmt(v.policy_ce,4),'交差エントロピー'),card('検証の操作一致率',fmt(v.teacher_top1*100,2)+'%','最大確率の操作と教師の一致'),card('学習周',fmt(r.iteration,0),'最新の進捗'),card('残り手数の予測誤差',fmt(v.remaining_mae,2)+' 手','検証データの平均絶対誤差'));
  $('context').textContent='trainは固定した訓練部分集合、valは検証データ。欠けた学習周の値は推測していない。';
  $('title-a').textContent='方策損失';$('title-b').textContent='教師との操作一致率';
  chart('chart-a',r.points,[{key:'train',color:'var(--alt)',label:'train'},{key:'val',color:'var(--accent)',label:'val'}],'CE');
  chart('chart-b',r.points,[{key:'train_accuracy',color:'var(--alt)',label:'train'},{key:'val_accuracy',color:'var(--accent)',label:'val'}],'%',[0,100]);
  for(const id of ['legend-a','legend-b'])$(id).innerHTML='<span><i class="key alt"></i>train</span><span><i class="key"></i>val</span>';
  $('diagnostics').textContent=`測定点：${r.points.length} · 更新回数 ${fmt(r.steps,0)}`;
  table(['周','train 損失','val 損失','train 一致率','val 一致率','val 手数予測誤差'],r.rows.map(x=>[x.epoch,fmt(x.train_fixed.policy_ce,4),fmt(x.validation.policy_ce,4),fmt(x.train_fixed.teacher_top1*100,2)+'%',fmt(x.validation.teacher_top1*100,2)+'%',fmt(x.validation.remaining_mae,2)+'手']));
 }
 const parts=r.id.split('/');if(r.kind==='bc')parts.splice(parts.length-1,0,'models');else parts.push('training');
 $('path').textContent='記録元：'+(r.source||'results/nn_rank/'+parts.join('/'));
 $('updated').textContent='画面取得：'+date(data.fetched_at)+'（日本時間）';
}
async function refresh(){
 if(busy)return;busy=true;$('refresh').disabled=true;
 try{const response=await fetch('/api/dashboard?window='+$('window').value,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();
  if(!data.runs.length){$('error').textContent='学習記録がまだ見つからない。';return;}
  if(!data.runs.some(r=>r.id===selected))selected=data.runs[0].id;
  $('run').replaceChildren(...data.runs.map(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.label;return o;}));$('run').value=selected;$('error').textContent='';render();
 }catch(e){$('error').textContent='更新できない：'+e.message+'。最後に取得した表示を保持している。';}finally{busy=false;$('refresh').disabled=false;}
}
$('run').addEventListener('change',()=>{selected=$('run').value;render();});$('window').addEventListener('change',refresh);$('refresh').addEventListener('click',refresh);
setInterval(()=>{if($('auto').checked&&!document.hidden)refresh();},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('auto').checked)refresh();});refresh();
</script></body></html>
